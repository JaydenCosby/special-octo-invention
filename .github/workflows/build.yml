name: Build APK (from zip)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          ls -la
          unzip -q OpenWebRX-Android.zip
          ls -la OpenWebRX-Android OpenWebRX-Android/app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: OpenWebRX-Android
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: openwebrx-debug-apk
          path: OpenWebRX-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
